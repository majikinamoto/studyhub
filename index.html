<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyHub</title>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="app-shell">
      <p class="app-kicker">学習カテゴリ</p>
      <h1>StudyHub</h1>
      <p class="header-copy">学びたいカテゴリを選んでください。</p>
    </div>
  </header>

  <main class="app-shell">
    <section class="section-stack" aria-labelledby="category-list-title">
      <div class="section-heading">
        <h2 id="category-list-title">カテゴリ</h2>
        <p>現在利用できるカテゴリを選択してください。</p>
      </div>

      <div class="card-grid">
        <article class="study-card">
          <div>
            <p class="card-label">カテゴリ</p>
            <h3>学校教育</h3>
            <p>学校の授業に沿った教材です。</p>
          </div>
          <a class="primary-button" href="./pages/category.html?category=school-education">開く</a>
        </article>
        <article class="study-card">
          <div>
            <p class="card-label">準備中</p>
            <h3>資格試験</h3>
            <p>資格試験向け教材は準備中です。</p>
          </div>
          <span class="primary-button is-disabled" aria-disabled="true">準備中</span>
        </article>
        <article class="study-card">
          <div>
            <p class="card-label">準備中</p>
            <h3>オリジナル教材</h3>
            <p>自作教材を使った学習は準備中です。</p>
          </div>
          <span class="primary-button is-disabled" aria-disabled="true">準備中</span>
        </article>
        <article class="study-card">
          <div>
            <p class="card-label">準備中</p>
            <h3>その他</h3>
            <p>その他の学習カテゴリは準備中です。</p>
          </div>
          <span class="primary-button is-disabled" aria-disabled="true">準備中</span>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
