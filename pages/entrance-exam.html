<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>高校受験 | StudyHub</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="app-shell site-header-inner">
      <a class="site-brand" href="../index.html">StudyHub</a>
      <a class="home-link" href="../index.html">ホームへ戻る</a>
    </div>
  </header>
  <header class="app-header">
    <div class="app-shell page-header">
      <nav class="breadcrumb" aria-label="パンくずリスト">
        <a href="../index.html">StudyHub</a>
        <a href="./category.html?category=school-education">学校教育</a>
        <span aria-current="page">高校受験</span>
      </nav>
      <p class="app-kicker">高校入試対策</p>
      <h1>高校受験</h1>
      <p class="header-copy">教科を選んでください。</p>
    </div>
  </header>
  <main class="app-shell">
    <section class="section-stack" aria-labelledby="entrance-subjects-title">
      <div class="section-heading">
        <h2 id="entrance-subjects-title">教科</h2>
        <p>高校入試に向けた学習内容です。</p>
      </div>
      <div class="card-grid">
        <article class="study-card">
          <div><p class="card-label">社会</p><h3>社会</h3><p>地理・歴史・公民の一問一答。</p></div>
          <a class="primary-button" href="./subject.html?course=entrance-social-studies">教材を見る</a>
        </article>
        <article class="study-card">
          <div><p class="card-label">理科</p><h3>理科</h3><p>物理の14項目・168問を4択で学習。</p></div>
          <a class="primary-button" href="./subject.html?course=entrance-science">教材を見る</a>
        </article>
        <article class="study-card">
          <div><p class="card-label">準備中</p><h3>英語</h3><p>高校入試に向けた英単語の学習。</p></div>
          <span class="primary-button is-disabled" aria-disabled="true">準備中</span>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
