<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>高専1年 | StudyHub</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="app-shell">
      <a class="text-link" href="./grade.html?school=kosen">高専</a>
      <p class="app-kicker">学年</p>
      <h1 id="grade-title">高専1年</h1>
      <p class="header-copy">教科を選んでください。</p>
    </div>
  </header>

  <main class="app-shell">
    <section class="section-stack" aria-labelledby="subject-list-title">
      <div class="section-heading">
        <h2 id="subject-list-title">高専1年</h2>
        <p>現在利用できる教科を選択してください。</p>
      </div>

      <div id="subject-list" class="card-grid">
        <article class="study-card">
          <div>
            <p class="card-label">利用可能</p>
            <h3>化学</h3>
            <p>高専1年の化学教材を開きます。</p>
          </div>
          <a class="primary-button" href="./subject.html?course=kosen-1-chemistry">開く</a>
        </article>
        <article class="study-card">
          <div>
            <p class="card-label">準備中</p>
            <h3>スポーツ実技</h3>
            <p>スポーツ実技の教材は準備中です。</p>
          </div>
          <span class="primary-button is-disabled" aria-disabled="true">準備中</span>
        </article>
      </div>
    </section>
  </main>

  <script type="module" src="../assets/js/subjects.js"></script>
</body>
</html>
