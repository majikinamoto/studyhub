<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英検 | StudyHub</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="app-shell site-header-inner">
      <a class="site-brand" href="../index.html">StudyHub</a>
      <a class="home-link" href="../index.html">ホームへ戻る</a>
    </div>
  </header>
  <header class="app-header">
    <div class="app-shell page-header">
      <nav class="breadcrumb" aria-label="パンくずリスト">
        <a href="../index.html">StudyHub</a>
<a href="./qualifications.html">資格試験</a>
<span aria-current="page">英検</span>
      </nav>
      <p class="app-kicker">資格試験</p>
      <h1>英検</h1>
      <p class="header-copy">受検する級や、単語・熟語の学習を選んでください。</p>
    </div>
  </header>
  <main class="app-shell">
    <section class="section-stack" aria-labelledby="list-title">
      <div class="section-heading">
        <h2 id="list-title">学習を選ぶ</h2>
      </div>
      <div class="card-grid">
        <article class="study-card">
        <div><p class="card-label">英検</p><h3>準2級</h3><p>準2級の分野・項目別教材を開きます。</p></div>
        <a class="primary-button" href="./eiken-pre2.html">開く</a>
      </article>
        <article class="study-card">
          <div><p class="card-label">Unit別学習</p><h3>英単語</h3><p>日本語から英単語を、3択またはタイピングで練習します。</p></div>
          <a class="primary-button" href="./eiken-words.html">開く</a>
        </article>
        <article class="study-card">
          <div><p class="card-label">Unit別学習</p><h3>英熟語</h3><p>単語を順番にクリックして、熟語を完成させます。</p></div>
          <a class="primary-button" href="./eiken-phrases.html">開く</a>
        </article>
        <article class="study-card">
          <div><p class="card-label">Unit別学習 · 各20問</p><h3>確認テスト</h3><p>英文の空欄を3択で解き、日本語訳と解説で復習します。</p></div>
          <a class="primary-button" href="./eiken-checks.html">開く</a>
        </article>
      </div>
    </section>
  </main>

</html>
