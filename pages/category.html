<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学校教育 | StudyHub</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="app-shell">
      <a class="text-link" href="../index.html">StudyHub</a>
      <p class="app-kicker">カテゴリ</p>
      <h1 id="category-title">学校教育</h1>
      <p class="header-copy">学校種別を選んでください。</p>
    </div>
  </header>

  <main class="app-shell">
    <section class="section-stack" aria-labelledby="school-list-title">
      <div class="section-heading">
        <h2 id="school-list-title">学校教育</h2>
        <p>現在利用できる教材を選択してください。</p>
      </div>

      <div id="school-list" class="card-grid">
        <article class="study-card">
          <div>
            <p class="card-label">準備中</p>
            <h3>中学校</h3>
            <p>中学校向け教材は準備中です。</p>
          </div>
          <span class="primary-button is-disabled" aria-disabled="true">準備中</span>
        </article>
        <article class="study-card">
          <div>
            <p class="card-label">準備中</p>
            <h3>高校</h3>
            <p>高校向け教材は準備中です。</p>
          </div>
          <span class="primary-button is-disabled" aria-disabled="true">準備中</span>
        </article>
        <article class="study-card">
          <div>
            <p class="card-label">利用可能</p>
            <h3>高専</h3>
            <p>高専向け教材を開きます。</p>
          </div>
          <a class="primary-button" href="./subject.html?course=kosen-1-chemistry">開く</a>
        </article>
        <article class="study-card">
          <div>
            <p class="card-label">準備中</p>
            <h3>大学</h3>
            <p>大学向け教材は準備中です。</p>
          </div>
          <span class="primary-button is-disabled" aria-disabled="true">準備中</span>
        </article>
      </div>
    </section>
  </main>

  <script type="module" src="../assets/js/category.js"></script>
</body>
</html>
