<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>高専 | StudyHub</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="app-shell site-header-inner">
      <a class="site-brand" href="../index.html">StudyHub</a>
      <a class="home-link" href="../index.html">ホームへ戻る</a>
    </div>
  </header>

  <header class="app-header">
    <div class="app-shell page-header">
      <nav class="breadcrumb" aria-label="パンくずリスト">
        <a href="../index.html">StudyHub</a>
        <a href="./category.html?category=school-education">学校教育</a>
        <span aria-current="page">高専</span>
      </nav>
      <p class="app-kicker">学校種別</p>

      <p class="header-copy">学年を選んでください。</p>
    </div>
  </header>

  <main class="app-shell">
    <section class="section-stack" aria-labelledby="grade-list-title">
      <div class="section-heading">
        <h2 id="grade-list-title">高専</h2>
        <p>現在利用できる学年を選択してください。</p>
      </div>

      <div id="grade-list" class="card-grid">
        <article class="study-card">
          <div>
            <p class="card-label">利用可能</p>
            <h3>高専1年</h3>
            <p>高専1年の教材を開きます。</p>
          </div>
          <a class="primary-button" href="./subjects.html?grade=kosen-1">開く</a>
        </article>
        <article class="study-card">
          <div>
            <p class="card-label">準備中</p>
            <h3>高専2年</h3>
            <p>高専2年向け教材は準備中です。</p>
          </div>
          <span class="primary-button is-disabled" aria-disabled="true">準備中</span>
        </article>
        <article class="study-card">
          <div>
            <p class="card-label">準備中</p>
            <h3>高専3年</h3>
            <p>高専3年向け教材は準備中です。</p>
          </div>
          <span class="primary-button is-disabled" aria-disabled="true">準備中</span>
        </article>
        <article class="study-card">
          <div>
            <p class="card-label">準備中</p>
            <h3>高専4年</h3>
            <p>高専4年向け教材は準備中です。</p>
          </div>
          <span class="primary-button is-disabled" aria-disabled="true">準備中</span>
        </article>
        <article class="study-card">
          <div>
            <p class="card-label">準備中</p>
            <h3>高専5年</h3>
            <p>高専5年向け教材は準備中です。</p>
          </div>
          <span class="primary-button is-disabled" aria-disabled="true">準備中</span>
        </article>
      </div>
    </section>
  </main>

  <script type="module" src="../assets/js/grade.js"></script>

</html>
