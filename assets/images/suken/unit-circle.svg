<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 310" role="img" aria-labelledby="title desc"><title id="title">単位円でsinθが2分の1となる角</title><desc id="desc">単位円の上半分で高さ2分の1の水平線が円と交わる2点は、角π/6と5π/6に対応する。</desc><rect width="460" height="310" rx="16" fill="#f4f8f3"/><g font-family="sans-serif" font-size="17" fill="#173d32"><path d="M60 160H355M205 285V35" stroke="#8a9e93" stroke-width="2"/><circle cx="205" cy="160" r="100" fill="none" stroke="#247455" stroke-width="3"/><path d="M90 110H320" stroke="#be6f24" stroke-width="3"/><path d="M205 160L291.603 110M205 160L118.397 110" stroke="#247455" stroke-width="2"/><circle cx="291.603" cy="110" r="5" fill="#be6f24"/><circle cx="118.397" cy="110" r="5" fill="#be6f24"/><text x="297" y="99">π/6</text><text x="63" y="99">5π/6</text><text x="328" y="114">高さ 1/2</text><text x="210" y="180">0</text><text x="305" y="181">1</text><text x="201" y="27">sinθ</text><text x="350" y="184">cosθ</text><text x="40" y="300">高さが同じ2点 → sinθ=1/2の解は2つ</text></g></svg>
