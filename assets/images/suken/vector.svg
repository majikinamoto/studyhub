<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img"><title>A(1,2)からB(4,6)へは横に3、縦に4進むので、ベクトルABは(3,4)。</title><rect width="520" height="300" rx="16" fill="#f4f8f3"/><g font-family="sans-serif" font-size="19" fill="#173d32" stroke-linecap="round"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247455"/></marker></defs><path d="M65 270H460M70 275V25" stroke="#6c8177" stroke-width="2"/><path d="M105 200H210V60" stroke="#be6f24" stroke-width="3" fill="none" stroke-dasharray="7 5"/><path d="M105 200L210 60" stroke="#247455" stroke-width="4" marker-end="url(#arrow)"/><circle cx="105" cy="200" r="5"/><text x="80" y="232">A(1,2)</text><text x="220" y="52">B(4,6)</text><text x="146" y="224">横 +3</text><text x="224" y="147">縦 +4</text><text x="460" y="273">x</text><text x="78" y="28">y</text></g></svg>
